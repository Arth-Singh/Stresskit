[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-kit"
version = "1.0.0.dev0"
description = "Offline-verifiable, claim-level audit protocol for mechanistic interpretability evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Arth Singh" }]
keywords = [
    "interpretability",
    "mechanistic-interpretability",
    "reproducibility",
    "stability",
    "sparse-autoencoders",
    "circuits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
full = ["scipy>=1.8"]
dev = ["pytest>=7", "scipy>=1.8"]
audit = ["cryptography>=42"]
control = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "cryptography>=42",
]

[project.scripts]
stresskit = "stresskit.cli:main"
stresskit-control-plane = "stresskit.control_cli:main"

[project.urls]
Homepage = "https://github.com/Arth-Singh/Stresskit"
Issues = "https://github.com/Arth-Singh/Stresskit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stresskit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
