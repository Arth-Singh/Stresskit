[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-kit"
version = "0.3.0"
description = "Stability and sanity-check harness for mechanistic interpretability claims. pytest + codecov for interp findings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Arth Singh" }]
keywords = [
    "interpretability",
    "mechanistic-interpretability",
    "reproducibility",
    "stability",
    "sparse-autoencoders",
    "circuits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
full = ["scipy>=1.8"]
dev = ["pytest>=7", "scipy>=1.8"]

[project.scripts]
stresskit = "stresskit.cli:main"

[project.urls]
Homepage = "https://github.com/Arth-Singh/Stresskit"
Issues = "https://github.com/Arth-Singh/Stresskit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stresskit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
