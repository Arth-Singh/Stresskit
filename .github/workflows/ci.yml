name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run examples
        run: |
          python examples/quickstart_toy.py
          python examples/sae_audit.py
          python examples/oracle_reliability.py

  test-minimal-deps:
    # core must work with numpy only (no scipy): greedy matcher fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without scipy
        run: |
          pip install -e .
          pip install pytest
      - name: Test
        run: pytest -q
